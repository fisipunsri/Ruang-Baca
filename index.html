<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kunjungan Ruang Baca</title>
  <link rel="icon" href="https://lh3.googleusercontent.com/d/1y7uSeQTv9gfPLRiTM7yYbW74Cpv6DXJp" type="image/png">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Poppins', 'sans-serif'] },
          colors: {
            unsri: {
              navy: '#1e3a8a',
              gold: '#fbbf24',
              light: '#f0fdf4'
            }
          }
        }
      }
    }
  

  <style>
    .table-container::-webkit-scrollbar { height: 8px; }
    .table-container::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
    .table-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .table-container::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .fade-in { animation: fadeIn 0.4s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* REVISI (FITUR BARU): saat tombol "Cetak Kartu Anggota" diklik (window.print()),
       hanya area kartu (#kartuCetakArea) yang tercetak, elemen lain disembunyikan. */
    @media print {
      body * { visibility: hidden; }
      #kartuCetakArea, #kartuCetakArea * { visibility: visible; }
      #kartuCetakArea { position: absolute; top: 0; left: 0; width: 100%; }
      .print\:hidden { display: none !important; }
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased min-h-screen flex flex-col items-center py-6 px-4 sm:px-6">

  <!-- REVISI (FITUR BARU): Player YouTube tersembunyi (musik latar) & tombol kontrol musik -->
  <div id="playerYoutube" style="position:absolute; width:0; height:0; overflow:hidden;"></div>
  <button id="btnMusik" onclick="toggleMusik()" title="Putar/Jeda Musik"
          class="fixed bottom-6 right-6 z-50 w-14 h-14 rounded-full bg-unsri-navy text-white shadow-lg flex items-center justify-center hover:bg-blue-900 transition-all duration-300">
    <i id="iconMusik" class="fa-solid fa-music text-lg"></i>
  </button>

  <div class="w-full max-w-4xl bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">
    
    <div class="h-48 sm:h-64 w-full bg-cover bg-center relative" 
         style="background-image: url('https://lh3.googleusercontent.com/d/1opFtHQPd0OSLfXgzvAaF6PXt0M_q2q26');">
      <div class="absolute inset-0 bg-unsri-navy bg-opacity-70 flex flex-col justify-center items-center text-center p-6">
        
        <img src="https://lh3.googleusercontent.com/d/1y7uSeQTv9gfPLRiTM7yYbW74Cpv6DXJp" alt="Logo Ruang Baca" class="h-24 sm:h-28 w-auto mb-4 drop-shadow-md" referrerpolicy="no-referrer">
        
        <h1 class="text-2xl sm:text-3xl font-bold text-white tracking-wide shadow-sm">Ruang Baca FISIP</h1>
        <p class="text-sm sm:text-base text-gray-200 mt-2">Universitas Sriwijaya</p>
      </div>
    </div>

    <div class="flex border-b border-gray-200 bg-white sticky top-0 z-10">
      <button onclick="switchTab('form')" id="tab-form" class="flex-1 py-4 text-sm font-semibold text-unsri-navy border-b-4 border-unsri-gold hover:bg-gray-50 transition">
        <i class="fa-solid fa-pen-to-square mr-2"></i> Isi Kunjungan
      </button>
      <button onclick="switchTab('dashboard')" id="tab-dashboard" class="flex-1 py-4 text-sm font-medium text-gray-500 border-b-4 border-transparent hover:text-unsri-navy hover:bg-gray-50 transition">
        <i class="fa-solid fa-chart-pie mr-2"></i> Dashboard
      </button>
      <button onclick="switchTab('kartuAnggota')" id="tab-kartuAnggota" class="flex-1 py-4 text-xs sm:text-sm font-medium text-gray-500 border-b-4 border-transparent hover:text-unsri-navy hover:bg-gray-50 transition">
        <i class="fa-solid fa-id-card mr-2"></i> Kartu Anggota Ruang Baca
      </button>
    </div>

    <div id="section-form" class="p-6 sm:p-10 fade-in">
      <div class="mb-8 text-center">
        <h2 class="text-2xl font-bold text-gray-800">Formulir Pengunjung</h2>
        <p class="text-gray-500 text-sm mt-1">Silakan isi data kunjungan Anda di bawah ini.</p>
      </div>

      <form id="formKunjungan" onsubmit="handleFormSubmit(event)" class="space-y-6">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Tanggal & Waktu</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <i class="fa-regular fa-clock text-gray-400"></i>
            </div>
            <input type="text" id="dateTimeDisplay" disabled 
                   class="w-full pl-10 pr-4 py-3 bg-gray-100 border border-gray-200 rounded-lg text-gray-500 cursor-not-allowed font-medium shadow-sm">
          </div>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Nama Lengkap</label>
          <div id="namaDropdownWrapper" class="relative">
            <input type="text" id="nama" name="nama" required autocomplete="off" placeholder="Ketik nama Anda untuk mencari, atau isi manual jika pengunjung baru"
                   class="w-full px-4 py-3 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-unsri-navy focus:border-unsri-navy transition shadow-sm placeholder-gray-400">
            <div id="namaDropdownList" class="hidden absolute z-20 mt-1 w-full bg-white border border-gray-300 rounded-lg shadow-lg max-h-52 overflow-y-auto"></div>
          </div>
          <p class="text-xs text-gray-500 mt-2"><i class="fa-solid fa-circle-info mr-1"></i> Jika nama Anda sudah pernah berkunjung, pilih dari daftar agar NIM, Jurusan, dan Kampus otomatis terisi. Jika belum pernah, ketik nama lengkap Anda lalu lanjutkan isi data di bawah secara manual.</p>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">NIM (Nomor Induk Mahasiswa)</label>
          <input type="text" id="nim" name="nim" required inputmode="numeric" pattern="[0-9]*" placeholder="Contoh: 07011282025001"
                 class="w-full px-4 py-3 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-unsri-navy focus:border-unsri-navy transition shadow-sm placeholder-gray-400">
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Program Studi / Jurusan</label>
          <div class="relative">
            <select id="jurusan" name="jurusan" required
                    class="w-full px-4 py-3 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-unsri-navy focus:border-unsri-navy transition shadow-sm appearance-none cursor-pointer">
              <option value="" disabled selected>-- Pilih Jurusan --</option>
              <option value="Administrasi Publik">Administrasi Publik</option>
              <option value="Sosiologi">Sosiologi</option>
              <option value="Ilmu Komunikasi">Ilmu Komunikasi</option>
              <option value="Ilmu Hubungan Internasional">Ilmu Hubungan Internasional</option>
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500">
              <i class="fa-solid fa-chevron-down text-xs"></i>
            </div>
          </div>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Tujuan Kunjungan</label>
          <div class="relative">
            <select id="keterangan" name="keterangan" required
                    class="w-full px-4 py-3 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-unsri-navy focus:border-unsri-navy transition shadow-sm appearance-none cursor-pointer">
              <option value="" disabled selected>-- Pilih Tujuan --</option>
              <option value="Membaca">Membaca / Belajar</option>
              <option value="Peminjaman Buku">Peminjaman Buku</option>
              <option value="Pengembalian Buku">Pengembalian Buku</option>
              <option value="Penyerahan Skripsi">Penyerahan Skripsi</option>
              <option value="Melakukan Zoom Meeting">Melakukan Zoom Meeting</option>
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500">
              <i class="fa-solid fa-chevron-down text-xs"></i>
            </div>
          </div>
        </div>

        <div id="containerFile" class="hidden transition-all duration-300 bg-blue-50 p-5 rounded-lg border border-blue-100 space-y-4">
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Judul Skripsi <span class="text-red-500">*</span></label>
            <textarea id="judulSkripsi" name="judulSkripsi" rows="2" placeholder="Masukkan judul skripsi lengkap"
                      class="w-full px-4 py-3 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-unsri-navy focus:border-unsri-navy transition shadow-sm placeholder-gray-400"></textarea>
          </div>
          
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Upload Berkas Skripsi <span class="text-red-500">*</span></label>
            <input type="file" id="fileSkripsi" accept=".pdf,.doc,.docx"
                   class="w-full px-4 py-2 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-unsri-navy focus:border-unsri-navy transition shadow-sm text-sm cursor-pointer file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-100 file:text-unsri-navy hover:file:bg-blue-200">
            <p class="text-xs text-gray-500 mt-2"><i class="fa-solid fa-circle-info mr-1"></i> Wajib dilampirkan untuk proses penyerahan skripsi.</p>
          </div>

          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Jumlah Buku <span class="text-red-500">*</span></label>
            <div class="relative">
              <select id="jumlahBuku" name="jumlahBuku"
                      class="w-full px-4 py-3 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-unsri-navy focus:border-unsri-navy transition shadow-sm appearance-none cursor-pointer">
                <option value="" disabled selected>-- Pilih Jumlah Buku --</option>
                <option value="1">1 Buku</option>
                <option value="2">2 Buku</option>
                <option value="3">3 Buku</option>
              </select>
              <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500">
                <i class="fa-solid fa-chevron-down text-xs"></i>
              </div>
            </div>
            <p class="text-xs text-gray-500 mt-2"><i class="fa-solid fa-circle-info mr-1"></i> Wajib menyerahkan buku sesuai jumlah yang dipilih.</p>
          </div>

          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Yudisium ke- <span class="text-red-500">*</span></label>
            <input type="text" id="yudisiumKe" name="yudisiumKe" inputmode="numeric" placeholder="Contoh: 145"
                   class="w-full px-4 py-3 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-unsri-navy focus:border-unsri-navy transition shadow-sm placeholder-gray-400">
          </div>

          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Alamat <span class="text-red-500">*</span></label>
            <textarea id="alamat" name="alamat" rows="2" placeholder="Masukkan alamat lengkap"
                      class="w-full px-4 py-3 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-unsri-navy focus:border-unsri-navy transition shadow-sm placeholder-gray-400"></textarea>
          </div>

          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">No. HP <span class="text-red-500">*</span></label>
            <input type="text" id="noHp" name="noHp" inputmode="tel" placeholder="Contoh: 081234567890"
                   class="w-full px-4 py-3 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-unsri-navy focus:border-unsri-navy transition shadow-sm placeholder-gray-400">
          </div>

          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Upload Foto Yudisium <span class="text-red-500">*</span></label>
            <input type="file" id="fotoYudisium" accept=".jpg,.jpeg,.png"
                   class="w-full px-4 py-2 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-unsri-navy focus:border-unsri-navy transition shadow-sm text-sm cursor-pointer file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-100 file:text-unsri-navy hover:file:bg-blue-200">
            <p class="text-xs text-gray-500 mt-2"><i class="fa-solid fa-circle-info mr-1"></i> Format JPG atau PNG.</p>
          </div>

          <div id="containerBuku" class="space-y-4"></div>
        </div>

        <div id="containerPeminjamanBuku" class="hidden transition-all duration-300 bg-amber-50 p-5 rounded-lg border border-amber-100 space-y-4">
          <p class="text-xs font-bold text-amber-700 uppercase tracking-wide"><i class="fa-solid fa-book mr-1"></i> Data Peminjaman Buku</p>

          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Tanggal Peminjaman <span class="text-red-500">*</span></label>
            <input type="date" id="tanggalPeminjaman" name="tanggalPeminjaman"
                   class="w-full px-4 py-3 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-unsri-navy focus:border-unsri-navy transition shadow-sm">
          </div>

          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Judul Buku <span class="text-red-500">*</span></label>
            <input type="text" id="judulBukuPinjam" name="judulBukuPinjam" placeholder="Masukkan judul buku"
                   class="w-full px-4 py-3 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-unsri-navy focus:border-unsri-navy transition shadow-sm placeholder-gray-400">
          </div>

          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Nama Pengarang <span class="text-red-500">*</span></label>
            <input type="text" id="pengarangBukuPinjam" name="pengarangBukuPinjam" placeholder="Masukkan nama pengarang"
                   class="w-full px-4 py-3 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-unsri-navy focus:border-unsri-navy transition shadow-sm placeholder-gray-400">
          </div>

          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Kode/Nomor Inventaris Buku <span class="text-red-500">*</span></label>
            <input type="text" id="kodeInventarisBuku" name="kodeInventarisBuku" placeholder="Contoh: 001/RB-FISIP/2026 (pisahkan koma jika lebih dari satu)"
                   class="w-full px-4 py-3 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-unsri-navy focus:border-unsri-navy transition shadow-sm placeholder-gray-400">
          </div>

          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Jumlah Buku yang Dipinjam <span class="text-red-500">*</span></label>
            <input type="number" id="jumlahBukuPinjam" name="jumlahBukuPinjam" min="1" placeholder="Masukkan jumlah buku"
                   class="w-full px-4 py-3 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-unsri-navy focus:border-unsri-navy transition shadow-sm placeholder-gray-400">
          </div>

          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Tanggal Pengembalian <span class="text-red-500">*</span></label>
            <input type="date" id="tanggalPengembalian" name="tanggalPengembalian"
                   class="w-full px-4 py-3 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-unsri-navy focus:border-unsri-navy transition shadow-sm">
          </div>

          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Tanda Tangan/Paraf Peminjam <span class="text-red-500">*</span></label>
            <div class="bg-white border border-gray-300 rounded-lg overflow-hidden shadow-sm">
              <canvas id="signaturePinjamCanvas" class="w-full touch-none cursor-crosshair block" style="height:150px;"></canvas>
            </div>
            <div class="flex justify-end mt-2">
              <button type="button" onclick="clearSignature('signaturePinjamCanvas')" class="text-xs font-semibold text-unsri-navy hover:text-blue-900 transition">
                <i class="fa-solid fa-eraser mr-1"></i> Hapus Tanda Tangan
              </button>
            </div>
            <p class="text-xs text-gray-500 mt-1"><i class="fa-solid fa-circle-info mr-1"></i> Silakan tanda tangan menggunakan jari atau mouse di kotak di atas.</p>
          </div>
        </div>

        <div id="containerPengembalianBuku" class="hidden transition-all duration-300 bg-emerald-50 p-5 rounded-lg border border-emerald-100 space-y-4">
          <p class="text-xs font-bold text-emerald-700 uppercase tracking-wide"><i class="fa-solid fa-rotate-left mr-1"></i> Data Pengembalian Buku</p>

          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Pilih Nama Peminjam <span class="text-red-500">*</span></label>
            <div class="relative">
              <select id="namaPeminjamDropdown"
                      class="w-full px-4 py-3 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-unsri-navy focus:border-unsri-navy transition shadow-sm appearance-none cursor-pointer">
                <option value="" selected>-- Pilih Nama Peminjam --</option>
              </select>
              <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500">
                <i class="fa-solid fa-chevron-down text-xs"></i>
              </div>
            </div>
            <p class="text-xs text-gray-500 mt-2"><i class="fa-solid fa-circle-info mr-1"></i> Daftar diambil dari data peminjaman buku yang belum dikembalikan.</p>
          </div>

          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Tanggal Peminjaman</label>
            <input type="text" id="pengembalianTanggalPinjamDisplay" disabled
                   class="w-full px-4 py-3 bg-gray-100 border border-gray-200 rounded-lg text-gray-500 cursor-not-allowed shadow-sm">
          </div>

          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Judul Buku</label>
            <input type="text" id="pengembalianJudulBukuDisplay" disabled
                   class="w-full px-4 py-3 bg-gray-100 border border-gray-200 rounded-lg text-gray-500 cursor-not-allowed shadow-sm">
          </div>

          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Nama Pengarang</label>
            <input type="text" id="pengembalianPengarangDisplay" disabled
                   class="w-full px-4 py-3 bg-gray-100 border border-gray-200 rounded-lg text-gray-500 cursor-not-allowed shadow-sm">
          </div>

          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Kode/Nomor Inventaris Buku</label>
            <input type="text" id="pengembalianKodeInventarisDisplay" disabled
                   class="w-full px-4 py-3 bg-gray-100 border border-gray-200 rounded-lg text-gray-500 cursor-not-allowed shadow-sm">
          </div>

          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Jumlah Buku yang Dipinjam</label>
            <input type="text" id="pengembalianJumlahBukuDisplay" disabled
                   class="w-full px-4 py-3 bg-gray-100 border border-gray-200 rounded-lg text-gray-500 cursor-not-allowed shadow-sm">
          </div>

          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Tanggal Pengembalian</label>
            <input type="text" id="pengembalianTanggalKembaliDisplay" disabled
                   class="w-full px-4 py-3 bg-gray-100 border border-gray-200 rounded-lg text-gray-500 cursor-not-allowed shadow-sm">
            <div id="notifTerlambat" class="hidden mt-2 text-sm font-semibold px-3 py-2 rounded-lg"></div>
          </div>

          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Tanda Tangan/Paraf Peminjam <span class="text-red-500">*</span></label>
            <div class="bg-white border border-gray-300 rounded-lg overflow-hidden shadow-sm">
              <canvas id="signatureKembaliCanvas" class="w-full touch-none cursor-crosshair block" style="height:150px;"></canvas>
            </div>
            <div class="flex justify-end mt-2">
              <button type="button" onclick="clearSignature('signatureKembaliCanvas')" class="text-xs font-semibold text-unsri-navy hover:text-blue-900 transition">
                <i class="fa-solid fa-eraser mr-1"></i> Hapus Tanda Tangan
              </button>
            </div>
            <p class="text-xs text-gray-500 mt-1"><i class="fa-solid fa-circle-info mr-1"></i> Silakan tanda tangan menggunakan jari atau mouse di kotak di atas.</p>
          </div>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Kampus</label>
          <div class="relative">
            <select id="kampus" name="kampus" required
                    class="w-full px-4 py-3 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-unsri-navy focus:border-unsri-navy transition shadow-sm appearance-none cursor-pointer">
              <option value="" disabled selected>-- Pilih Kampus --</option>
              <option value="Indralaya">Indralaya</option>
              <option value="Palembang">Palembang</option>
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500">
              <i class="fa-solid fa-chevron-down text-xs"></i>
            </div>
          </div>
        </div>

        <button type="submit" id="btnSubmit" 
                class="w-full mt-4 bg-unsri-navy hover:bg-blue-900 text-white font-bold py-3.5 px-4 rounded-lg shadow-lg transform transition hover:-translate-y-0.5 focus:outline-none focus:ring-4 focus:ring-blue-300 flex justify-center items-center">
          <span id="btnText">Simpan Kunjungan <i class="fa-solid fa-paper-plane ml-2"></i></span>
          <svg id="btnSpinner" class="hidden animate-spin ml-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>

  <script>
    // GANTI dengan URL Web App Apps Script kamu (harus sama dengan yang dipakai di Code.gs)
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzDmjOQUY8cmLRyQ5Yvi83xdSzhGKYzBIydYzIFsg4_f09-hsmBr-z9bzM0h9o5dGlmgQ/exec";

    // Variabel global untuk menampung riwayat data di client-side demi validasi NIM ganda
    window.globalRiwayat = [];

    // REVISI (FITUR BARU): Variabel global untuk menampung daftar peminjaman buku
    // yang belum dikembalikan (dipakai untuk dropdown "Nama" pada form Pengembalian Buku)
    window.globalDaftarPeminjaman = [];

    // REVISI (FITUR BARU): Variabel global untuk menampung daftar nama mahasiswa yang
    // pernah berkunjung (dipakai untuk dropdown pencarian "Nama Lengkap" di form kunjungan).
    // namaDipilihDariDaftar menandai apakah nama saat ini berasal dari klik dropdown
    // tersebut (true) atau diketik manual oleh pengunjung baru (false).
    window.globalDaftarMahasiswa = [];
    let namaDipilihDariDaftar = false;

    // REVISI (FITUR BARU): Variabel global untuk fitur Kartu Anggota Ruang Baca.
    // globalDaftarKartuAnggotaNim menampung NIM yang sudah pernah membuat kartu
    // (dipakai untuk validasi dini di frontend). namaKartuTerpilih menampung data
    // mahasiswa (nama/nim/jurusan/kampus) yang dipilih dari dropdown pencarian nama
    // pada form Kartu Anggota.
    window.globalDaftarKartuAnggotaNim = [];
    let namaKartuTerpilih = null;

    // ==========================================
    // REVISI (FITUR BARU): Sapaan suara & musik latar dari YouTube
    // ==========================================
    let pengalamanAudioDimulai = false;
    let musikYoutubeIdAktif = '';
    let youtubeApiSiap = false;
    let ytPlayer = null;
    let ytPlayerSiap = false;
    let musikBolehDiputar = false;

    // Dipanggil otomatis oleh script YouTube IFrame API begitu selesai dimuat.
    function onYouTubeIframeAPIReady() {
      youtubeApiSiap = true;
      cobaBuatPlayerYoutube();
    }

    function cobaBuatPlayerYoutube() {
      if (!youtubeApiSiap || !musikYoutubeIdAktif || ytPlayer) return;

      ytPlayer = new YT.Player('playerYoutube', {
        height: '0',
        width: '0',
        videoId: musikYoutubeIdAktif,
        playerVars: {
          loop: 1,
          playlist: musikYoutubeIdAktif, // wajib diisi sama dengan videoId agar loop 1 video berjalan terus-menerus
          controls: 0,
          disablekb: 1,
          fs: 0,
          modestbranding: 1,
          playsinline: 1
        },
        events: {
          onReady: function(ev) {
            ytPlayerSiap = true;
            ev.target.setVolume(60);
            if (musikBolehDiputar) ev.target.playVideo();
          },
          onStateChange: function(ev) {
            if (ev.data === YT.PlayerState.PLAYING) updateIconMusik(true);
            if (ev.data === YT.PlayerState.PAUSED) updateIconMusik(false);
          }
        }
      });
    }

    function ambilSuaraCewek(daftarSuara) {
      return daftarSuara.find(function(v) { return v.lang && v.lang.toLowerCase().indexOf('id') === 0 && /female|wanita|perempuan/i.test(v.name); })
          || daftarSuara.find(function(v) { return v.lang && v.lang.toLowerCase().indexOf('id') === 0; })
          || daftarSuara.find(function(v) { return /female|wanita|perempuan/i.test(v.name); })
          || null;
    }

    function putarSuara(teks, onSelesai) {
      if (!('speechSynthesis' in window)) {
        if (onSelesai) onSelesai();
        return;
      }

      // REVISI (BUG FIX - HP): pakai penanda supaya ucapkan() tidak
      // terpanggil dua kali kalau event voiceschanged & timeout di bawah
      // sama-sama terpicu.
      let sudahDiucapkan = false;

      const ucapkan = function() {
        if (sudahDiucapkan) return;
        sudahDiucapkan = true;

        const utter = new SpeechSynthesisUtterance(teks);
        utter.lang = 'id-ID';
        utter.pitch = 1.1;
        utter.rate = 0.95;

        const suaraCewek = ambilSuaraCewek(window.speechSynthesis.getVoices());
        if (suaraCewek) utter.voice = suaraCewek;

        utter.onend = function() { if (onSelesai) onSelesai(); };
        utter.onerror = function() { if (onSelesai) onSelesai(); };

        window.speechSynthesis.speak(utter);
      };

      if (window.speechSynthesis.getVoices().length === 0) {
        window.speechSynthesis.onvoiceschanged = ucapkan;
        // REVISI (BUG FIX - HP): Sebagian browser di HP (terutama beberapa
        // versi Safari/iOS) TIDAK PERNAH memicu event "voiceschanged",
        // sehingga sapaan suara jadi macet tanpa batas waktu - dan musik
        // latar yang menyusul setelah sapaan pun ikut tidak pernah jalan.
        // Jaring pengaman: kalau daftar suara belum juga siap dalam waktu
        // singkat, tetap lanjut bicara pakai suara default.
        setTimeout(ucapkan, 300);
      } else {
        ucapkan();
      }
    }

    function updateIconMusik(sedangMain) {
      const icon = document.getElementById('iconMusik');
      if (!icon) return;
      icon.classList.toggle('fa-music', !sedangMain);
      icon.classList.toggle('fa-volume-high', sedangMain);
    }

    function mulaiMusik() {
      musikBolehDiputar = true;
      if (!musikYoutubeIdAktif) return;
      if (ytPlayerSiap && ytPlayer && typeof ytPlayer.playVideo === 'function') {
        ytPlayer.playVideo();
      } else {
        cobaBuatPlayerYoutube();
      }
    }

    function mulaiPengalamanAudio() {
      if (pengalamanAudioDimulai) return;
      pengalamanAudioDimulai = true;

      // REVISI (BUG FIX): musik sekarang langsung diputar DI SINI, di dalam
      // interaksi klik/sentuhan pengguna yang pertama - bukan lagi menunggu
      // sapaan suara selesai dulu (lewat callback putarSuara). Menunggu
      // sapaan suara selesai butuh beberapa detik, dan begitu waktu itu
      // lewat, browser (terutama Chrome) sudah menganggap izin autoplay dari
      // klik pengguna tadi kedaluwarsa - sehingga perintah putar musik ke
      // iframe YouTube ditolak diam-diam tanpa error apa pun, dan musik jadi
      // terkesan "tidak mau" otomatis berputar.
      cobaBuatPlayerYoutube();
      mulaiMusik();

      putarSuara('Selamat datang bagi pengunjung ruang baca FISIP Unsri');
    }

    function toggleMusik() {
      if (!musikYoutubeIdAktif) return;
      if (!ytPlayer || !ytPlayerSiap) {
        musikBolehDiputar = true;
        mulaiPengalamanAudio();
        return;
      }
      if (ytPlayer.getPlayerState() === YT.PlayerState.PLAYING) {
        musikBolehDiputar = false;
        ytPlayer.pauseVideo();
        updateIconMusik(false);
      } else {
        musikBolehDiputar = true;
        ytPlayer.playVideo();
        updateIconMusik(true);
      }
    }

    function putarUcapanTerimaKasih() {
      const musikSedangMain = ytPlayer && ytPlayerSiap && ytPlayer.getPlayerState() === YT.PlayerState.PLAYING;
      if (musikSedangMain) ytPlayer.setVolume(15);

      putarSuara('Terima kasih telah berkunjung ke ruang baca FISIP Unsri', function() {
        if (musikSedangMain) ytPlayer.setVolume(60);
      });
    }

    function musikSedangDiputar() {
      return !!(ytPlayer && ytPlayerSiap && typeof ytPlayer.getPlayerState === 'function' && ytPlayer.getPlayerState() === YT.PlayerState.PLAYING);
    }

    // REVISI (BUG FIX): Sebelumnya listener ini hanya jalan SEKALI ({ once:
    // true }) untuk klik/sentuhan/keyboard pertama di halaman. Masalahnya,
    // klik pertama sering terjadi SEBELUM data ID musik (musikYoutubeIdAktif)
    // selesai dimuat dari server lewat fetch getDashboardData - sehingga
    // percobaan pertama itu gagal total, dan karena listener sudah "dipakai
    // habis", klik-klik berikutnya di kolom form lain tidak pernah mencoba
    // memutar musik lagi. Sekarang listener TETAP aktif dan akan terus
    // mencoba di setiap interaksi berikutnya, sampai musik benar-benar
    // berhasil berputar - tapi tidak akan memaksa nyala lagi kalau musik
    // sengaja di-pause manual lewat tombol (lihat musikBolehDiputar di atas).
    function bukaKunciAudioOtomatis() {
      if (musikSedangDiputar()) return;
      if (pengalamanAudioDimulai && !musikBolehDiputar) return;

      if (!pengalamanAudioDimulai) {
        musikBolehDiputar = true;
        mulaiPengalamanAudio();
      } else if (musikYoutubeIdAktif) {
        musikBolehDiputar = true;
        if (ytPlayer && ytPlayerSiap) {
          ytPlayer.playVideo();
        } else {
          cobaBuatPlayerYoutube();
        }
      }
    }
    ['click', 'touchstart', 'keydown'].forEach(function(evt) {
      document.addEventListener(evt, bukaKunciAudioOtomatis, { passive: true });
    });

    function updateClock() {
      const now = new Date();
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', timeZoneName: 'short' };
      document.getElementById('dateTimeDisplay').value = now.toLocaleDateString('id-ID', options);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // REVISI (BUG FIX): Mengembalikan tanggal hari ini dalam format dd/MM/yyyy
    // sesuai zona waktu Asia/Jakarta, supaya sinkron dengan format Timestamp
    // yang disimpan backend (lihat Utilities.formatDate(..., 'Asia/Jakarta',
    // 'dd/MM/yyyy HH:mm:ss') di Code.gs). Dipakai untuk validasi NIM ganda
    // supaya hanya membatasi kunjungan PADA HARI YANG SAMA, bukan selamanya.
    function getTodayDateStrJakarta() {
      const parts = new Intl.DateTimeFormat('en-GB', {
        timeZone: 'Asia/Jakarta',
        day: '2-digit',
        month: '2-digit',
        year: 'numeric'
      }).formatToParts(new Date());

      const day = parts.find(function(p) { return p.type === 'day'; }).value;
      const month = parts.find(function(p) { return p.type === 'month'; }).value;
      const year = parts.find(function(p) { return p.type === 'year'; }).value;

      return day + '/' + month + '/' + year;
    }

    // Memuat data riwayat kunjungan langsung saat pertama kali halaman di-load
    loadDashboardData();

    document.getElementById('keterangan').addEventListener('change', function() {
      const containerFile = document.getElementById('containerFile');
      const fileInput = document.getElementById('fileSkripsi');
      const judulInput = document.getElementById('judulSkripsi');
      const jumlahBukuInput = document.getElementById('jumlahBuku');
      const containerBuku = document.getElementById('containerBuku');
      const containerPeminjaman = document.getElementById('containerPeminjamanBuku');
      const containerPengembalian = document.getElementById('containerPengembalianBuku');
      const namaInput = document.getElementById('nama');
      const nimInput = document.getElementById('nim');
      const jurusanInput = document.getElementById('jurusan');
      const kampusInput = document.getElementById('kampus');

      // Reset dulu semua container opsional & field terkait ke kondisi awal
      containerFile.classList.add('hidden');
      fileInput.required = false;
      fileInput.value = '';
      judulInput.required = false;
      judulInput.value = '';
      jumlahBukuInput.required = false;
      jumlahBukuInput.value = '';
      containerBuku.innerHTML = '';

      // REVISI (FITUR BARU): reset field Yudisium ke-, Alamat, No. HP, dan
      // Upload Foto Yudisium ke kondisi awal
      document.getElementById('yudisiumKe').required = false;
      document.getElementById('yudisiumKe').value = '';
      document.getElementById('alamat').required = false;
      document.getElementById('alamat').value = '';
      document.getElementById('noHp').required = false;
      document.getElementById('noHp').value = '';
      document.getElementById('fotoYudisium').required = false;
      document.getElementById('fotoYudisium').value = '';

      containerPeminjaman.classList.add('hidden');
      resetPeminjamanBukuFields();

      containerPengembalian.classList.add('hidden');
      resetPengembalianBukuFields();

      namaInput.required = true;
      namaInput.readOnly = false;
      nimInput.required = true;
      nimInput.readOnly = false;
      jurusanInput.disabled = false;
      kampusInput.disabled = false;

      // REVISI (FITUR BARU): jika nama sudah dipilih dari daftar dropdown,
      // tetap kunci NIM/Jurusan/Kampus walau Tujuan Kunjungan diganti-ganti.
      if (namaDipilihDariDaftar) {
        nimInput.readOnly = true;
        jurusanInput.disabled = true;
        kampusInput.disabled = true;
      }

      if (this.value === 'Penyerahan Skripsi') {
        containerFile.classList.remove('hidden');
        fileInput.required = true; 
        judulInput.required = true; 
        jumlahBukuInput.required = true;
        document.getElementById('yudisiumKe').required = true;
        document.getElementById('alamat').required = true;
        document.getElementById('noHp').required = true;
        document.getElementById('fotoYudisium').required = true;
      } else if (this.value === 'Peminjaman Buku') {
        containerPeminjaman.classList.remove('hidden');
        ['tanggalPeminjaman', 'judulBukuPinjam', 'pengarangBukuPinjam', 'kodeInventarisBuku', 'jumlahBukuPinjam', 'tanggalPengembalian'].forEach(function(id) {
          document.getElementById(id).required = true;
        });
        initSignaturePad('signaturePinjamCanvas');
        const inputTanggalPinjam = document.getElementById('tanggalPeminjaman');
        if (inputTanggalPinjam && !inputTanggalPinjam.value) inputTanggalPinjam.valueAsDate = new Date();
      } else if (this.value === 'Pengembalian Buku') {
        containerPengembalian.classList.remove('hidden');
        initSignaturePad('signatureKembaliCanvas');
        isiDropdownPeminjamBuku();
        namaInput.required = false;
        namaInput.readOnly = true;
        nimInput.required = false;
        nimInput.readOnly = true;
        jurusanInput.disabled = true;
        kampusInput.disabled = true;
        // REVISI (FITUR BARU): form Pengembalian Buku punya dropdown & mekanisme
        // pengisian nama sendiri (namaPeminjamDropdown), jadi tandai nama TIDAK
        // sedang berasal dari dropdown pencarian "Nama Lengkap".
        namaDipilihDariDaftar = false;
      }
    });

    // REVISI (FITUR BARU): fungsi bantu untuk fitur Peminjaman Buku & Pengembalian Buku
    function resetPeminjamanBukuFields() {
      ['tanggalPeminjaman', 'judulBukuPinjam', 'pengarangBukuPinjam', 'kodeInventarisBuku', 'jumlahBukuPinjam', 'tanggalPengembalian'].forEach(function(id) {
        const el = document.getElementById(id);
        if (el) { el.required = false; el.value = ''; }
      });
      clearSignature('signaturePinjamCanvas');
    }

    function resetPengembalianBukuFields() {
      const dropdown = document.getElementById('namaPeminjamDropdown');
      if (dropdown) dropdown.value = '';
      ['pengembalianTanggalPinjamDisplay', 'pengembalianJudulBukuDisplay', 'pengembalianPengarangDisplay', 'pengembalianKodeInventarisDisplay', 'pengembalianJumlahBukuDisplay', 'pengembalianTanggalKembaliDisplay'].forEach(function(id) {
        const el = document.getElementById(id);
        if (el) el.value = '';
      });
      const notif = document.getElementById('notifTerlambat');
      if (notif) { notif.classList.add('hidden'); notif.innerHTML = ''; }
      clearSignature('signatureKembaliCanvas');
    }

    function isiDropdownPeminjamBuku() {
      const dropdown = document.getElementById('namaPeminjamDropdown');

    function cekStatusKeterlambatan(tanggalKembaliStr, namaMhs) {
      const notif = document.getElementById('notifTerlambat');
      if (!tanggalKembaliStr) { notif.classList.add('hidden'); return; }

      const now = new Date();
      const todayStr = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');

      notif.classList.remove('hidden');

      if (todayStr > tanggalKembaliStr) {
        const satuHari = 24 * 60 * 60 * 1000;
        const selisihHari = Math.round((new Date(todayStr) - new Date(tanggalKembaliStr)) / satuHari);
        notif.className = 'mt-2 text-sm font-semibold px-3 py-2 rounded-lg bg-red-100 text-red-700 border border-red-200';
        notif.innerHTML = '<i class="fa-solid fa-triangle-exclamation mr-1"></i> Terlambat ' + selisihHari + ' hari dari batas pengembalian!';

        Swal.fire({
          title: 'Peringatan Keterlambatan!',
          text: namaMhs + ' terlambat mengembalikan buku selama ' + selisihHari + ' hari dari tanggal pengembalian yang ditentukan.',
          icon: 'warning',
          confirmButtonColor: '#1e3a8a'
        });
      } else {
        notif.className = 'mt-2 text-sm font-semibold px-3 py-2 rounded-lg bg-green-100 text-green-700 border border-green-200';
        notif.innerHTML = '<i class="fa-solid fa-circle-check mr-1"></i> Pengembalian tepat waktu.';
      }
    }

    // mahasiswa yang pernah berkunjung (diambil dari sheet Data_Kunjungan lewat
    // getDashboardData -> daftarMahasiswa). Nama yang sama hanya muncul sekali, dan
    // pencarian tidak peduli huruf besar/kecil. Saat nama diklik dari daftar, NIM,
    // Jurusan, dan Kampus otomatis terisi & dikunci. Mahasiswa yang namanya belum
    // ada di daftar (belum pernah berkunjung) tetap bisa mengetik nama barunya dan
    // melanjutkan mengisi NIM/Jurusan/Kampus secara manual seperti biasa; nama

    function renderNamaDropdown(filterText) {
      const listEl = document.getElementById('namaDropdownList');
      const daftar = window.globalDaftarMahasiswa || [];
      const filterLower = (filterText || '').trim().toLowerCase();

      const hasil = filterLower

      }

    // REVISI (FITUR BARU): Signature pad (tanda tangan) untuk Peminjaman & Pengembalian Buku
    const signaturePads = {};

    function initSignaturePad(canvasId) {
      const canvas = document.getElementById(canvasId);
      if (!canvas || canvas.dataset.initialized === 'true') return;
      canvas.dataset.initialized = 'true';

      const ctx = canvas.getContext('2d');
      let menggambar = false;
      let posisiTerakhir = null;

      function resizeCanvas() {
        const rasio = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * rasio;
        canvas.height = 150 * rasio;
        ctx.scale(rasio, rasio);
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#1e293b';
      }
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      function ambilPosisi(e) {
        const rect = canvas.getBoundingClientRect();
        const titik = e.touches ? e.touches[0] : e;
        return { x: titik.clientX - rect.left, y: titik.clientY - rect.top };
      }

      function mulaiGambar(e) {
        menggambar = true;
        signaturePads[canvasId] = true;
        posisiTerakhir = ambilPosisi(e);
      }
      function gambar(e) {
        if (!menggambar) return;
        e.preventDefault();
        const posisi = ambilPosisi(e);
        ctx.beginPath();
        ctx.moveTo(posisiTerakhir.x, posisiTerakhir.y);
        ctx.lineTo(posisi.x, posisi.y);
        ctx.stroke();
        posisiTerakhir = posisi;
      }
      function selesaiGambar() {
        menggambar = false;
        posisiTerakhir = null;
      }

      canvas.addEventListener('mousedown', mulaiGambar);
      canvas.addEventListener('mousemove', gambar);
      window.addEventListener('mouseup', selesaiGambar);
      canvas.addEventListener('touchstart', mulaiGambar, { passive: true });
      canvas.addEventListener('touchmove', gambar, { passive: false });
      canvas.addEventListener('touchend', selesaiGambar);
    }

    function clearSignature(canvasId) {
      const canvas = document.getElementById(canvasId);
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      signaturePads[canvasId] = false;
    }

    function isSignatureEmpty(canvasId) {
      return !signaturePads[canvasId];
    }

    function getSignatureDataUrl(canvasId) {
      const canvas = document.getElementById(canvasId);
      if (!canvas) return null;
      return canvas.toDataURL('image/png');
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      
      const nimVal = document.getElementById('nim').value.trim();
      const keteranganVal = document.getElementById('keterangan').value;

      // REVISI (BUG FIX): Validasi proteksi input ganda berdasarkan NIM yang
      // sama kini dibatasi PER HARI (memakai tanggal zona waktu Asia/Jakarta),
      // sehingga NIM yang sama TIDAK diblokir lagi di hari yang berbeda.
      // Dalam satu hari yang sama, NIM yang sama boleh input maksimal 2 kali,
      // TAPI kedua kunjungan itu wajib punya Tujuan Kunjungan ("keterangan")
      // yang BERBEDA - kunjungan dengan tujuan yang SAMA pada hari yang sama
      // dianggap kunjungan ganda dan ditolak, walaupun baru percobaan
      // pertama/kedua hari itu. Jika tujuannya berbeda, tetap boleh disimpan
      // pada hari yang sama, sampai maksimal 2 kali.
      //
      // Catatan: pengecekan di sini hanya peringatan dini di frontend
      // (memakai data riwayat yang tersedia di browser). Validasi yang
      // SEBENARNYA menentukan (dan tidak bisa dilewati walau data di browser
      // belum sinkron/lengkap) tetap dilakukan di backend - lihat fungsi
      // cekBatasKunjunganHarian() di Code.gs.
      const todayStr = getTodayDateStrJakarta();
      const kunjunganNimHariIni = window.globalRiwayat
        ? window.globalRiwayat.filter(function(row) {
            return String(row.nim).trim() === nimVal && String(row.waktu).trim().indexOf(todayStr) === 0;
          })
        : [];

      const sudahAdaKeteranganSama = kunjunganNimHariIni.some(function(row) {
        return String(row.keterangan).trim() === keteranganVal;
      });

      if (sudahAdaKeteranganSama) {
        Swal.fire({
          title: 'Peringatan!',
          text: 'Anda sudah mencatat kunjungan dengan tujuan "' + keteranganVal + '" hari ini. Silakan pilih tujuan kunjungan yang berbeda, atau coba lagi besok.',
          icon: 'warning',
          confirmButtonColor: '#1e3a8a'
        });
        return;
      }

      if (kunjunganNimHariIni.length >= 2) {
        Swal.fire({
          title: 'Peringatan!',
          text: 'User dengan NIM tersebut sudah menginput kunjungan sebanyak 2 kali hari ini, sehingga tidak bisa input untuk ketiga kalinya hari ini. Silakan coba lagi besok.',
          icon: 'warning',
          confirmButtonColor: '#1e3a8a'
        });
        return;
      }
      
      const btn = document.getElementById('btnSubmit');
      const btnText = document.getElementById('btnText');
      const spinner = document.getElementById('btnSpinner');
      
      btn.disabled = true;
      btn.classList.add('opacity-80', 'cursor-not-allowed');
      btnText.innerText = 'Menyimpan...';
      spinner.classList.remove('hidden');

      const fileInput = document.getElementById('fileSkripsi');
      const judulVal = document.getElementById('judulSkripsi') ? document.getElementById('judulSkripsi').value : ""; 
      const jumlahBukuVal = document.getElementById('jumlahBuku') ? document.getElementById('jumlahBuku').value : "";

      let dataBuku = [];
      if (keteranganVal === 'Penyerahan Skripsi' && jumlahBukuVal) {
        const jumlah = parseInt(jumlahBukuVal, 10);
        for (let i = 1; i <= jumlah; i++) {
          dataBuku.push({
            judul: document.getElementById('judulBuku' + i).value,
            pengarang: document.getElementById('pengarangBuku' + i).value,
            tahun: document.getElementById('tahunBuku' + i).value
          });
        }
      }

      const formData = {
        nama: document.getElementById('nama').value,
        nim: nimVal,
        jurusan: document.getElementById('jurusan').value,
        kampus: document.getElementById('kampus').value,
        keterangan: keteranganVal,
        judulSkripsi: judulVal, 
        jumlahBuku: jumlahBukuVal,
        dataBuku: dataBuku,
        fileData: null,
        fileName: null
      };

      // REVISI (FITUR BARU): validasi & data untuk Peminjaman Buku
      if (keteranganVal === 'Peminjaman Buku') {
        if (isSignatureEmpty('signaturePinjamCanvas')) {
          Swal.fire('Peringatan!', 'Tanda tangan/paraf peminjam wajib diisi!', 'warning');
          resetButtonState(btn, btnText, spinner);
          return;
        }
        formData.tanggalPeminjaman = document.getElementById('tanggalPeminjaman').value;
        formData.judulBukuPinjam = document.getElementById('judulBukuPinjam').value;
        formData.pengarangBukuPinjam = document.getElementById('pengarangBukuPinjam').value;
        formData.kodeInventarisBuku = document.getElementById('kodeInventarisBuku').value;
        formData.jumlahBukuPinjam = document.getElementById('jumlahBukuPinjam').value;
        formData.tanggalPengembalian = document.getElementById('tanggalPengembalian').value;
        formData.signatureData = getSignatureDataUrl('signaturePinjamCanvas');
      }

      // REVISI (FITUR BARU): validasi & data untuk Pengembalian Buku
      if (keteranganVal === 'Pengembalian Buku') {
        const namaPeminjamDropdown = document.getElementById('namaPeminjamDropdown');
        if (!namaPeminjamDropdown.value) {
          Swal.fire('Peringatan!', 'Silakan pilih nama peminjam terlebih dahulu!', 'warning');
          resetButtonState(btn, btnText, spinner);
          return;
        }
        if (isSignatureEmpty('signatureKembaliCanvas')) {
          Swal.fire('Peringatan!', 'Tanda tangan/paraf peminjam wajib diisi!', 'warning');
          resetButtonState(btn, btnText, spinner);
          return;
        }
        // REVISI (FITUR BARU): kirim ID peminjaman terpilih supaya backend bisa
        // mencocokkan secara presisi (bukan lagi berdasarkan teks), sehingga
        // nama yang sudah dikembalikan otomatis hilang dari dropdown ini.
        const dataPeminjamTerpilih = (window.globalDaftarPeminjaman || [])[namaPeminjamDropdown.value];
        formData.idPeminjaman = dataPeminjamTerpilih ? dataPeminjamTerpilih.id : '';
        formData.pengembalianTanggalPinjam = document.getElementById('pengembalianTanggalPinjamDisplay').value;
        formData.pengembalianJudulBuku = document.getElementById('pengembalianJudulBukuDisplay').value;
        formData.pengembalianPengarangBuku = document.getElementById('pengembalianPengarangDisplay').value;
        formData.pengembalianKodeInventaris = document.getElementById('pengembalianKodeInventarisDisplay').value;
        formData.pengembalianJumlahBuku = document.getElementById('pengembalianJumlahBukuDisplay').value;
        formData.pengembalianTanggalKembali = document.getElementById('pengembalianTanggalKembaliDisplay').value;
        formData.signatureData = getSignatureDataUrl('signatureKembaliCanvas');
      }

      if (keteranganVal === 'Penyerahan Skripsi') {
        if (fileInput.files.length === 0) {
          Swal.fire('Peringatan!', 'File skripsi wajib diunggah!', 'warning');
          resetButtonState(btn, btnText, spinner);
          return; 
        }

        if (!jumlahBukuVal) {
          Swal.fire('Peringatan!', 'Jumlah buku wajib dipilih!', 'warning');
          resetButtonState(btn, btnText, spinner);
          return;
        }

        // REVISI (FITUR BARU): validasi field Yudisium ke-, Alamat, No. HP,
        // dan Upload Foto Yudisium (semua wajib diisi untuk Penyerahan Skripsi)
        const yudisiumKeVal = document.getElementById('yudisiumKe').value.trim();
        const alamatVal = document.getElementById('alamat').value.trim();
        const noHpVal = document.getElementById('noHp').value.trim();
        const fotoYudisiumInput = document.getElementById('fotoYudisium');

        if (!yudisiumKeVal || !alamatVal || !noHpVal) {
          Swal.fire('Peringatan!', 'Yudisium ke-, Alamat, dan No. HP wajib diisi!', 'warning');
          resetButtonState(btn, btnText, spinner);
          return;
        }

        if (fotoYudisiumInput.files.length === 0) {
          Swal.fire('Peringatan!', 'Foto yudisium wajib diunggah!', 'warning');
          resetButtonState(btn, btnText, spinner);
          return;
        }

        formData.yudisiumKe = yudisiumKeVal;
        formData.alamat = alamatVal;
        formData.noHp = noHpVal;

        const file = fileInput.files[0];
        const fotoYudisiumFile = fotoYudisiumInput.files[0];
        const reader = new FileReader();
        
        reader.onload = function(event) {
          formData.fileData = event.target.result;
          formData.fileName = "Skripsi_" + formData.nim + "_" + file.name;

          const readerFoto = new FileReader();
          readerFoto.onload = function(eventFoto) {
            formData.fotoYudisiumData = eventFoto.target.result;
            formData.fotoYudisiumName = "FotoYudisium_" + formData.nim + "_" + fotoYudisiumFile.name;
            kirimDataKeBackend(formData, btn, btnText, spinner);
          };
          readerFoto.readAsDataURL(fotoYudisiumFile);
        };
        reader.readAsDataURL(file);
        
      } else {
        kirimDataKeBackend(formData, btn, btnText, spinner);
      }
    }

    // REVISI: Dulu pakai google.script.run, sekarang pakai fetch() POST
    // dengan Content-Type text/plain supaya tidak kena CORS preflight.
    function kirimDataKeBackend(formData, btn, btnText, spinner) {
      fetch(WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'submitKunjungan', data: formData })
      })
        .then(function(res) { return res.json(); })
        .then(function(response) {
          resetButtonState(btn, btnText, spinner);

          if (response.success) {
            Swal.fire({
              title: 'Berhasil!',
              text: 'Data kunjungan Anda telah dicatat.',
              icon: 'success',
              confirmButtonColor: '#1e3a8a',
              timer: 3000,
              timerProgressBar: true
            });
            // REVISI (FITUR BARU): Ucapan terima kasih setelah berhasil simpan kunjungan
            putarUcapanTerimaKasih();

            // REVISI (FITUR BARU): Klik tombol "Simpan Kunjungan" adalah
            // interaksi pengguna yang nyata & jelas, baik di laptop/PC
            // maupun HP, sehingga momen kunjungan berhasil disimpan ini
            // dipakai juga sebagai jaminan tambahan supaya musik latar
            // otomatis terputar (kalau sebelumnya gagal/belum sempat
            // terputar karena kebijakan autoplay browser).
            if (!pengalamanAudioDimulai) {
              mulaiPengalamanAudio();
            } else {
              mulaiMusik();
            }

            document.getElementById('formKunjungan').reset();
            document.getElementById('containerFile').classList.add('hidden');
            document.getElementById('containerBuku').innerHTML = '';
            document.getElementById('containerPeminjamanBuku').classList.add('hidden');
            document.getElementById('containerPengembalianBuku').classList.add('hidden');
            resetPeminjamanBukuFields();
            resetPengembalianBukuFields();
            document.getElementById('nama').readOnly = false;
            document.getElementById('nim').readOnly = false;
            document.getElementById('jurusan').disabled = false;
            document.getElementById('kampus').disabled = false;
            namaDipilihDariDaftar = false;
            sembunyikanDropdownNama();
            loadDashboardData();
          } else {
            Swal.fire('Error!', 'Gagal menyimpan: ' + response.message, 'error');
          }
        })
        .catch(function(error) {
          resetButtonState(btn, btnText, spinner);
          Swal.fire('Error Sistem!', 'Terjadi kesalahan jaringan atau server.', 'error');
        });
    }

    function resetButtonState(btn, btnText, spinner) {
      btn.disabled = false;
      btn.classList.remove('opacity-80', 'cursor-not-allowed');
      btnText.innerHTML = 'Simpan Kunjungan <i class="fa-solid fa-paper-plane ml-2"></i>';
      spinner.classList.add('hidden');
    }

    // REVISI: Dulu pakai google.script.run, sekarang pakai fetch() GET
    // ke {WEB_APP_URL}?action=getDashboardData
    function loadDashboardData() {
      fetch(WEB_APP_URL + '?action=getDashboardData')
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if (data.error) {
            console.error("Database Error:", data.error);
            document.getElementById('tableRiwayat').innerHTML = `<tr><td colspan="10" class="px-6 py-8 text-center text-red-500 italic"><i class="fa-solid fa-triangle-exclamation mr-2"></i> Database Error. Mohon cek file Spreadsheet.</td></tr>`;
            return;
          }

          window.globalRiwayat = data.riwayat || [];
          window.globalDaftarPeminjaman = data.daftarPeminjamanBuku || [];
          window.globalDaftarMahasiswa = data.daftarMahasiswa || [];
          window.globalDaftarKartuAnggotaNim = data.daftarKartuAnggotaNim || [];

          // REVISI (BUG FIX - HP): ID video YouTube dari spreadsheet (sheet
          // "Pengaturan", baris "MusikYoutubeID") disimpan di sini, TAPI
          // sapaan suara + musik latar TIDAK dipaksa jalan otomatis saat
          // halaman baru dimuat lagi. Kebijakan autoplay banyak browser di
          // HP (terutama Safari/iOS) memblokir percobaan tanpa interaksi
          // pengguna secara diam-diam - dan sebelumnya blokir ini membuat
          // sapaan suara jadi tidak pernah dicoba ulang sama sekali.
          // Sapaan + musik akan mulai begitu ada interaksi pengguna PERTAMA
          // di halaman (lihat bukaKunciAudioOtomatis), dan dijamin dicoba
          // lagi saat kunjungan berhasil disimpan (lihat kirimDataKeBackend).
          if (data.musikYoutubeId) {
            musikYoutubeIdAktif = data.musikYoutubeId;

            // REVISI (BUG FIX): player YouTube-nya langsung disiapkan
            // (dibuat & dibiarkan buffering di latar belakang) DI SINI, begitu
            // ID musik selesai dimuat dari server - bukan lagi ditunda sampai
            // pengunjung berinteraksi pertama kali. Sebelumnya, player baru
            // mulai dibuat TEPAT saat sapaan suara juga mulai diucapkan,
            // padahal iframe YouTube butuh waktu beberapa detik untuk siap
            // sebelum benar-benar bisa memutar suara - sehingga begitu player
            // akhirnya siap, sapaan suara (yang mulai hampir seketika) sudah
            // lebih dulu selesai, dan musik terasa telat/tidak berbarengan
            // dengan sapaan. Dengan disiapkan lebih awal (sambil pengunjung
            // masih mengisi formulir), player biasanya sudah siap sebelum
            // interaksi pertama terjadi, sehingga musik & sapaan bisa mulai
            // hampir bersamaan. Pemanggilan ini aman dari kebijakan autoplay
            // browser karena hanya MENYIAPKAN player (belum memerintahkan
            // putar) - perintah putar sesungguhnya tetap menunggu interaksi
            // pengguna (lihat mulaiMusik/onReady).
            cobaBuatPlayerYoutube();

            // Kasus balapan (race condition): pengguna sudah lebih dulu
            // berinteraksi dengan halaman sebelum ID musik ini selesai
            // dimuat dari server, jadi musiknya belum sempat diputar saat
            // itu. Sekarang ID sudah ada, coba mainkan musiknya.
            if (pengalamanAudioDimulai && musikBolehDiputar) {
              mulaiMusik();
            }
          }

          document.getElementById('statTotalToday').innerText = data.totalKunjungan || 0;

          let jurusanHtml = '';
          const maxStats = Math.max(...Object.values(data.statsJurusan)) || 1;
          
          for (const [key, value] of Object.entries(data.statsJurusan)) {
            const percentage = (value / maxStats) * 100;
            jurusanHtml += `
              <div>
                <div class="flex justify-between text-xs mb-1">
                  <span class="font-medium text-gray-700">${key}</span>
                  <span class="text-gray-500 font-bold">${value}</span>
                </div>
                <div class="w-full bg-gray-100 rounded-full h-2">
                  <div class="bg-unsri-gold h-2 rounded-full transition-all duration-500" style="width: ${percentage}%"></div>
                </div>
              </div>
            `;
          }
          document.getElementById('statJurusanContainer').innerHTML = jurusanHtml;

          let tableHtml = '';
          if (data.riwayat && data.riwayat.length > 0) {
            data.riwayat.forEach(row => {
              
              let fileBadge = row.fileUrl && row.fileUrl !== '-' 
                  ? `<span class="inline-flex items-center text-xs font-medium text-gray-400 cursor-not-allowed" title="Akses file dibatasi"><i class="fa-solid fa-lock mr-1"></i> Lihat File</span>`
                  : `<span class="text-gray-400 text-xs">-</span>`;

              let jumlahBukuBadge = row.jumlahBuku && row.jumlahBuku !== '-'
                  ? `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-amber-100 text-amber-800">${row.jumlahBuku} Buku</span>`
                  : `<span class="text-gray-400 text-xs">-</span>`;

              let daftarBukuHtml = row.daftarBuku && row.daftarBuku !== '-'
                  ? row.daftarBuku.split('|').map(s => s.trim()).join('<br>')
                  : '-';

              tableHtml += `
                <tr class="hover:bg-gray-50 transition border-b border-gray-100">
                  <td class="px-6 py-4 whitespace-normal text-gray-500 text-xs">
                    <i class="fa-regular fa-clock mr-1"></i> ${row.waktu || '-'}
                  </td>
                  <td class="px-6 py-4 whitespace-normal font-semibold text-gray-800 text-sm">
                    ${row.nama || '-'}
                  </td>
                  <td class="px-6 py-4 whitespace-normal">
                    <div class="inline-block bg-blue-50 text-unsri-navy font-mono text-[11px] px-2 py-0.5 rounded border border-blue-100 shadow-sm">
                      ${row.nim || '-'}
                    </div>
                  </td>
                  <td class="px-6 py-4 whitespace-normal">
                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-unsri-navy">
                      ${row.jurusan || '-'}
                    </span>
                  </td>
                  <td class="px-6 py-4 whitespace-normal text-gray-700 text-sm font-medium">
                    ${row.kampus || '-'}
                  </td>
                  <td class="px-6 py-4 whitespace-normal text-gray-600 text-sm">
                    ${row.keterangan || '-'}
                  </td>
                  <td class="px-6 py-4 whitespace-normal text-gray-600 text-xs italic">
                    ${row.judulSkripsi || '-'}
                  </td>
                  <td class="px-6 py-4 whitespace-normal">
                    ${jumlahBukuBadge}
                  </td>
                  <td class="px-6 py-4 whitespace-normal text-gray-600 text-xs">
                    ${daftarBukuHtml}
                  </td>
                  <td class="px-6 py-4 whitespace-normal">
                    ${fileBadge}
                  </td>
                </tr>
              `;
            });
          } else {
            tableHtml = `<tr><td colspan="10" class="px-6 py-8 text-center text-gray-500 italic">Belum ada data kunjungan.</td></tr>`;
          }
          document.getElementById('tableRiwayat').innerHTML = tableHtml;
        })
        .catch(function(error) {
          console.error("Fetch Error:", error);
          document.getElementById('tableRiwayat').innerHTML = `<tr><td colspan="10" class="px-6 py-8 text-center text-red-500 italic"><i class="fa-solid fa-triangle-exclamation mr-2"></i> Gagal memuat data. Cek koneksi/URL Web App.</td></tr>`;
        });
    }

    // Dropdown pencarian "Nama Lengkap" pada form Kartu Anggota. Memakai data
    // yang sama dengan dropdown pencarian nama di form kunjungan
    // (window.globalDaftarMahasiswa, dari sheet Data_Kunjungan lewat
    // getDashboardData), supaya NIM/Program Studi/Kampus otomatis terisi &
    // dikunci sesuai data kunjungan mahasiswa tersebut.
    function renderNamaKartuDropdown(filterText) {
      const listEl = document.getElementById('namaKartuDropdownList');
      const daftar = window.globalDaftarMahasiswa || [];
      const filterLower = (filterText || '').trim().toLowerCase();

      const hasil = filterLower
        ? daftar.filter(function(m) { return m.nama.toLowerCase().indexOf(filterLower) !== -1; })
        : daftar;

      if (hasil.length === 0) {
        listEl.innerHTML = '<div class="px-4 py-3 text-xs text-gray-400 italic">Nama tidak ditemukan. Silakan isi Formulir Kunjungan terlebih dahulu di tab "Isi Kunjungan".</div>';
      } else {
        listEl.innerHTML = hasil.map(function(m) {
          const idxAsli = daftar.indexOf(m);
          return '<div class="px-4 py-2.5 hover:bg-pink-50 cursor-pointer text-sm text-gray-700 border-b border-gray-50 last:border-0" data-idx="' + idxAsli + '">' + m.nama + '</div>';
        }).join('');
      }
      listEl.classList.remove('hidden');
    }

    function sembunyikanDropdownNamaKartu() {
      const listEl = document.getElementById('namaKartuDropdownList');
      if (listEl) listEl.classList.add('hidden');
    }

    function pilihNamaKartu(data) {
      document.getElementById('namaKartu').value = data.nama;
      document.getElementById('nimKartu').value = data.nim;
      document.getElementById('jurusanKartu').value = data.jurusan;
      document.getElementById('kampusKartu').value = data.kampus;
      namaKartuTerpilih = data;
      sembunyikanDropdownNamaKartu();
    }

    document.getElementById('namaKartuDropdownList').addEventListener('click', function(e) {
      const target = e.target.closest('[data-idx]');
      if (!target) return;
      const idx = parseInt(target.getAttribute('data-idx'), 10);
      const data = (window.globalDaftarMahasiswa || [])[idx];
      if (!data) return;
      pilihNamaKartu(data);
    });

    document.getElementById('namaKartu').addEventListener('focus', function() {
      renderNamaKartuDropdown(this.value);
    });

    document.getElementById('namaKartu').addEventListener('input', function() {
      // Nama diketik ulang -> anggap belum ada pilihan yang valid sampai
      // pengunjung memilih lagi dari daftar, supaya NIM/Jurusan/Kampus tidak
      // ikut-ikutan salah menempel ke nama yang berbeda.
      namaKartuTerpilih = null;
      document.getElementById('nimKartu').value = '';
      document.getElementById('jurusanKartu').value = '';
      document.getElementById('kampusKartu').value = '';
      renderNamaKartuDropdown(this.value);
    });

    document.getElementById('namaKartu').addEventListener('blur', function() {
      setTimeout(sembunyikanDropdownNamaKartu, 150);
    });

    document.addEventListener('click', function(e) {
      const wrapper = document.getElementById('namaKartuDropdownWrapper');
      if (wrapper && !wrapper.contains(e.target)) {
        sembunyikanDropdownNamaKartu();
      }
    });

    function resetTombolKartu(btn, btnText, spinner) {
      btn.disabled = false;
      btn.classList.remove('opacity-80', 'cursor-not-allowed');
      btnText.innerHTML = 'Buat Kartu Anggota <i class="fa-solid fa-id-card ml-2"></i>';
      spinner.classList.add('hidden');
    }

    function handleKartuAnggotaSubmit(e) {
      e.preventDefault();

      if (!namaKartuTerpilih) {
        Swal.fire('Peringatan!', 'Silakan pilih nama Anda dari daftar yang muncul terlebih dahulu.', 'warning');
        return;
      }

      const fotoInput = document.getElementById('fotoKartu');
      if (fotoInput.files.length === 0) {
        Swal.fire('Peringatan!', 'Foto mahasiswa wajib diunggah (JPG/PNG)!', 'warning');
        return;
      }

      // REVISI (FITUR BARU): cegah NIM yang sudah terdaftar membuat Kartu
      // Anggota lagi. Ini hanya peringatan dini di frontend; validasi yang
      // sebenarnya menentukan tetap dilakukan di backend - lihat
      // submitKartuAnggota() di Code.gs.
      const nimTerpilih = String(namaKartuTerpilih.nim || '').trim();
      const sudahPunyaKartu = (window.globalDaftarKartuAnggotaNim || []).indexOf(nimTerpilih) !== -1;
      if (sudahPunyaKartu) {
        Swal.fire({
          title: 'Sudah Terdaftar!',
          text: 'NIM ini sudah pernah membuat Kartu Anggota Ruang Baca sebelumnya.',
          icon: 'warning',
          confirmButtonColor: '#be185d'
        });
        return;
      }

      const btn = document.getElementById('btnSubmitKartu');
      const btnText = document.getElementById('btnTextKartu');
      const spinner = document.getElementById('btnSpinnerKartu');
      btn.disabled = true;
      btn.classList.add('opacity-80', 'cursor-not-allowed');
      btnText.innerText = 'Memproses...';
      spinner.classList.remove('hidden');

      const file = fotoInput.files[0];
      const reader = new FileReader();

      reader.onload = function(event) {
        const fotoDataUrl = event.target.result;
        const dataUntukBackend = {
          nama: namaKartuTerpilih.nama,
          nim: namaKartuTerpilih.nim,
          jurusan: namaKartuTerpilih.jurusan,
          kampus: namaKartuTerpilih.kampus,
          fotoData: fotoDataUrl,
          fotoName: "FotoKartu_" + namaKartuTerpilih.nim + "_" + file.name
        };

        fetch(WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'submitKartuAnggota', data: dataUntukBackend })
        })
          .then(function(res) { return res.json(); })
          .then(function(response) {
            resetTombolKartu(btn, btnText, spinner);

            if (response.success) {
              // REVISI (FITUR BARU): kartu anggota langsung dirender di sini
              // memakai foto (base64) yang sudah ada di browser, tanpa perlu
              // menunggu URL Google Drive (yang butuh waktu untuk siap diakses).
              tampilkanKartuAnggota({
                nama: namaKartuTerpilih.nama,
                nim: namaKartuTerpilih.nim,
                jurusan: namaKartuTerpilih.jurusan,
                kampus: namaKartuTerpilih.kampus,
                fotoDataUrl: fotoDataUrl
              });

              if (window.globalDaftarKartuAnggotaNim) window.globalDaftarKartuAnggotaNim.push(nimTerpilih);

              document.getElementById('formKartuAnggota').reset();
              document.getElementById('nimKartu').value = '';
              document.getElementById('jurusanKartu').value = '';
              document.getElementById('kampusKartu').value = '';
              namaKartuTerpilih = null;
            } else {
              Swal.fire('Gagal!', response.message || 'Gagal membuat kartu anggota.', 'error');
            }
          })
          .catch(function(error) {
            resetTombolKartu(btn, btnText, spinner);
            Swal.fire('Error Sistem!', 'Terjadi kesalahan jaringan atau server.', 'error');
          });
      };
      reader.readAsDataURL(file);
    }

    // REVISI (FITUR BARU): merender Kartu Anggota Ruang Baca (tampak depan &
    // belakang) memakai data yang baru saja disimpan, lengkap dengan tombol

            </div>
            <div class="p-5 text-[11px] sm:text-xs text-gray-700 space-y-1.5">
              <p class="font-semibold text-gray-800 mb-1">Ketentuan Penggunaan:</p>
              <div class="flex gap-1"><span class="flex-shrink-0">1.</span><span class="flex-1 min-w-0">Kartu ini berlaku sebagai tanda anggota Ruang Baca FISIP Universitas Sriwijaya.</span></div>

              <div class="flex gap-1"><span class="flex-shrink-0">4.</span><span class="flex-1 min-w-0">Kehilangan atau kerusakan kartu menjadi tanggung jawab pemilik.</span></div>
              <div class="flex gap-1"><span class="flex-shrink-0">5.</span><span class="flex-1 min-w-0">Pelanggaran terhadap ketentuan Ruang Baca dapat dikenakan sanksi sesuai peraturan yang berlaku.</span></div>

        <div class="text-center mt-6 print:hidden">
          <button id="btnUnduhKartu" onclick="unduhKartuAnggotaPDF()" class="bg-pink-700 hover:bg-pink-800 text-white font-bold py-3 px-6 rounded-lg shadow-lg transition">
