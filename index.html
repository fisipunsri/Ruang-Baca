<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kunjungan Ruang Baca</title>

<link rel="icon" href="https://lh3.googleusercontent.com/d/1y7uSeQTv9gfPLRiTM7yYbW74Cpv6DXJp" type="image/png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #1e3a8a;
    font-family: Arial, sans-serif;
  }
  #loader {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #1e3a8a;
    color: #fff;
    z-index: 10;
    transition: opacity 0.3s ease;
  }
  .spinner {
    width: 44px;
    height: 44px;
    border: 4px solid rgba(255,255,255,0.25);
    border-top-color: #fbbf24;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 14px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #appFrame {
    width: 100%;
    height: 100vh;
    border: none;
    display: block;
  }
  #fallback {
    display: none;
    position: fixed;
    inset: 0;
    background: #1e3a8a;
    color: #fff;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    z-index: 11;
  }
  #fallback a {
    margin-top: 16px;
    background: #fbbf24;
    color: #1e3a8a;
    font-weight: 600;
    padding: 10px 20px;
    border-radius: 8px;
    text-decoration: none;
  }
</style>
</head>
<body>

  <div id="loader">
    <div class="spinner"></div>
    <p>Memuat Sistem Kunjungan Ruang Baca...</p>
  </div>

  <div id="fallback">
    <p>Halaman tidak bisa dimuat di dalam frame ini.</p>
    <a id="fallbackLink" href="#" target="_blank" rel="noopener">Buka di Tab Baru</a>
  </div>

  <iframe
    id="appFrame"
    title="Sistem Kunjungan Ruang Baca FISIP UNSRI"
    allow="clipboard-write; fullscreen"
    referrerpolicy="no-referrer-when-downgrade">
  </iframe>

  <script>
    // GANTI baris di bawah ini dengan URL Web App Apps Script kamu (yang diakhiri /exec)
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzDmjOQUY8cmLRyQ5Yvi83xdSzhGKYzBIydYzIFsg4_f09-hsmBr-z9bzM0h9o5dGlmgQ/exec";

    const frame = document.getElementById('appFrame');
    const loader = document.getElementById('loader');
    const fallback = document.getElementById('fallback');
    const fallbackLink = document.getElementById('fallbackLink');

    fallbackLink.href = WEB_APP_URL;
    frame.src = WEB_APP_URL;

    let loaded = false;

    frame.addEventListener('load', function () {
      loaded = true;
      loader.style.opacity = '0';
      setTimeout(function () { loader.style.display = 'none'; }, 300);
    });

    // Jika dalam 8 detik iframe belum termuat (mis. diblokir X-Frame-Options / kebijakan browser),
    // tampilkan tombol fallback untuk buka langsung di tab baru.
    setTimeout(function () {
      if (!loaded) {
        loader.style.display = 'none';
        fallback.style.display = 'flex';
      }
    }, 8000);
  </script>

</body>
</html>
